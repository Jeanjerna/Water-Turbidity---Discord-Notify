[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    olikraus/Ucglib@1.5.2
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.2
build_src_filter = -<*> +<main.cpp> +<NetworkService.cpp>
board_build.embed_txtfiles = certs/discord_roots.pem

[env:lcd-test]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<test/lcd_test.cpp>

[env:wifi-test]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<test/wifi_test.cpp>
lib_deps =
    ${env:esp32doit-devkit-v1.lib_deps}
    tzapu/WiFiManager@2.0.17

[env:discord-test]
extends = env:wifi-test
build_flags = -D DISCORD_TEST
board_build.embed_txtfiles = certs/discord_roots.pem

[env:adc-test]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<test/adc_test.cpp>
